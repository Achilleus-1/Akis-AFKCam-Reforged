plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_archive_name}-${minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}
sourceSets {
    smokeHost {
        runtimeClasspath = sourceSets.main.runtimeClasspath - sourceSets.main.output
    }
}
def copySmokeJar = tasks.register('copySmokeJar', Sync) {
    from tasks.named('jar')
    into layout.projectDirectory.dir('run-smoke/mods')
}
neoForge {
    version = neo_version
    runs {
        client {
            client()
            if (project.hasProperty('smokeTest')) {
                gameDirectory = file('run-smoke')
                systemProperty 'ji.afkcinematic.runtimeTest', 'true'
                systemProperty 'ji.afkcinematic.autoSmokeTest', 'true'
                systemProperty 'mixin.debug.verbose', 'true'
            }
        }
        packagedSmoke {
            client()
            sourceSet = sourceSets.smokeHost
            loadedMods = []
            gameDirectory = file('run-smoke')
            taskBefore copySmokeJar
            systemProperty 'ji.afkcinematic.runtimeTest', 'true'
            systemProperty 'ji.afkcinematic.autoSmokeTest', 'true'
            systemProperty 'ji.afkcinematic.testLocalMusic', 'true'
            if (project.hasProperty('testKeybindings')) {
                systemProperty 'ji.afkcinematic.testKeybindings', 'true'
            }
            systemProperty 'mixin.debug.verbose', 'true'
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

jar {
    from('LICENSE')
    manifest.attributes('Implementation-Title': mod_name, 'Implementation-Version': project.version)
}

// Keep packaged mod metadata in sync with gradle.properties.
def modProperties = [
    'minecraft_version_range', 'neo_version_range', 'loader_version_range',
    'mod_id', 'mod_name', 'mod_version', 'mod_license', 'mod_authors'
].collectEntries { name -> [(name): project.property(name)] }

tasks.named('processResources', ProcessResources) {
    inputs.properties(modProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(modProperties)
    }
}
